[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pynstall"
version = "0.1.0"
description = "Turn your Python scripts into proper Windows apps - venv-aware shortcuts with taskbar pinning"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "TMJ" }
]
keywords = [
    "windows",
    "shortcut",
    "installer",
    "desktop",
    "venv",
    "launcher",
    "taskbar",
    "app",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Desktop Environment",
    "Topic :: Software Development :: Build Tools",
    "Topic :: System :: Installation/Setup",
]
dependencies = [
    "click>=8.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
appid = ["pywin32>=306"]
dev = [
    "pytest>=7.0",
    "pywin32>=306",
]

[project.scripts]
pynstall = "pynstall.cli:main"

[project.urls]
Homepage = "https://github.com/tmj/pynstall"
Repository = "https://github.com/tmj/pynstall"
Issues = "https://github.com/tmj/pynstall/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/pynstall"]

[tool.pytest.ini_options]
testpaths = ["tests"]
